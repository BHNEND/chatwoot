name: 部署 Chatwoot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 准备 SSH 私钥
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/chatwoot_deploy"
          chmod 600 "$HOME/.ssh/chatwoot_deploy"

      - name: 部署到服务器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"

          ssh \
            -i "$HOME/.ssh/chatwoot_deploy" \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "export DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") REPO_URL=$(printf '%q' "$REPO_URL"); bash -s" <<'REMOTE'
          set -euo pipefail

          git config --global --add safe.directory "$DEPLOY_PATH"

          if [ -d "$DEPLOY_PATH/.git" ]; then
            if git -C "$DEPLOY_PATH" remote get-url origin >/dev/null 2>&1; then
              git -C "$DEPLOY_PATH" remote set-url origin "$REPO_URL"
            else
              git -C "$DEPLOY_PATH" remote add origin "$REPO_URL"
            fi
            git -C "$DEPLOY_PATH" fetch --depth=1 origin develop
            git -C "$DEPLOY_PATH" reset --hard FETCH_HEAD
          elif [ -e "$DEPLOY_PATH" ]; then
            test -d "$DEPLOY_PATH"
            test -f "$DEPLOY_PATH/.env"
            git -C "$DEPLOY_PATH" init
            if git -C "$DEPLOY_PATH" remote get-url origin >/dev/null 2>&1; then
              git -C "$DEPLOY_PATH" remote set-url origin "$REPO_URL"
            else
              git -C "$DEPLOY_PATH" remote add origin "$REPO_URL"
            fi
            git -C "$DEPLOY_PATH" fetch --depth=1 origin develop
            git -C "$DEPLOY_PATH" checkout -B develop FETCH_HEAD
          else
            mkdir -p "$(dirname "$DEPLOY_PATH")"
            git clone --depth=1 --branch develop "$REPO_URL" "$DEPLOY_PATH"
          fi

          cd "$DEPLOY_PATH"
          test -f .env
          docker compose -f docker-compose.production.yaml config >/dev/null
          docker compose -f docker-compose.production.yaml pull postgres redis
          docker compose -f docker-compose.production.yaml build --pull rails sidekiq
          docker compose -f docker-compose.production.yaml run --rm -T --interactive=false rails bundle exec rails db:chatwoot_prepare
          docker compose -f docker-compose.production.yaml down --remove-orphans
          echo '占用 3000 端口的 Docker 容器：'
          docker ps --filter publish=3000 --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}'
          echo '占用 3000 端口的主机进程：'
          ss -ltnp | awk '$4 ~ /:3000$/ { print }' || true
          echo '占用 3001 端口的 Docker 容器：'
          docker ps --filter publish=3001 --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}'
          echo '占用 3001 端口的主机进程：'
          ss -ltnp | awk '$4 ~ /:3001$/ { print }' || true
          docker compose -f docker-compose.production.yaml up -d --remove-orphans
          for service in rails sidekiq; do
            container_id=$(docker compose -f docker-compose.production.yaml ps -q "$service")
            test -n "$container_id"
            test "$(docker inspect -f '{{.State.Running}}' "$container_id")" = true
          done
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --head --max-time 5 http://127.0.0.1:13100/api; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo 'Chatwoot API 在等待 60 秒后仍未就绪' >&2
              exit 1
            fi
            sleep 5
          done
          docker compose -f docker-compose.production.yaml ps
          REMOTE
